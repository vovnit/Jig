<!doctype html>
<meta charset="utf-8">
<title>Jig demo animations</title>
<style>html, body { margin: 0; background: #0a0d1f; } canvas { display: block; }</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// The demo video's how-it-works animations, drawn on one canvas. Every frame is a pure
// function of time: renderFrame(id, t, duration, section) draws scene `id` at `t`
// seconds, so scripts/demo-animate.mjs can step through it frame by frame.
const W = 1920, H = 1080;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const C = {
  ink: "#ffffff", soft: "#b0badf", dim: "rgba(255,255,255,0.08)", line: "rgba(255,255,255,0.16)",
  accent: "#6b7aff", violet: "#b861ff", green: "#38d39f", red: "#ff6b6b", amber: "#ffc857", code: "#0f1430",
};
const FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif';
const MONO = '"SF Mono", Menlo, monospace';

// ---------- Time ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (p) => 1 - Math.pow(1 - p, 3);
const easeInOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const lerp = (a, b, p) => a + (b - a) * p;
const pop = (p) => (p <= 0 ? 0 : p >= 1 ? 1 : 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2)); // overshoot

// ---------- Drawing ----------
function background() {
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#0a0d1f"); g.addColorStop(1, "#1a1240");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  glow(1340, 560, 760, "rgba(107,122,255,0.30)");
  glow(260, 980, 700, "rgba(184,97,255,0.16)");
}
function glow(x, y, r, color) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function card(x, y, w, h, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  if (o.shadow !== false) { ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 40; ctx.shadowOffsetY = 16; }
  rr(x, y, w, h, o.r ?? 22);
  ctx.fillStyle = o.fill ?? "rgba(255,255,255,0.075)"; ctx.fill();
  ctx.shadowColor = "transparent";
  ctx.lineWidth = o.lw ?? 2; ctx.strokeStyle = o.stroke ?? C.line; ctx.stroke();
  ctx.restore();
}
function text(s, x, y, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.font = `${o.weight ?? 600} ${o.size ?? 28}px ${o.mono ? MONO : FONT}`;
  ctx.fillStyle = o.color ?? C.ink; ctx.textAlign = o.align ?? "left"; ctx.textBaseline = o.base ?? "middle";
  if (o.spacing) ctx.letterSpacing = `${o.spacing}px`;
  ctx.fillText(s, x, y);
  const w = ctx.measureText(s).width;
  ctx.restore();
  return w;
}
function arrow(x0, y0, x1, y1, p, o = {}) {
  if (p <= 0) return;
  const x = lerp(x0, x1, p), y = lerp(y0, y1, p);
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.strokeStyle = o.color ?? C.accent; ctx.fillStyle = o.color ?? C.accent; ctx.lineWidth = o.lw ?? 4; ctx.lineCap = "round";
  if (o.dash) ctx.setLineDash(o.dash);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
  ctx.setLineDash([]);
  if (p > 0.15) {
    const a = Math.atan2(y1 - y0, x1 - x0);
    ctx.beginPath(); ctx.moveTo(x + 6 * Math.cos(a), y + 6 * Math.sin(a));
    ctx.lineTo(x - 16 * Math.cos(a - 0.5), y - 16 * Math.sin(a - 0.5));
    ctx.lineTo(x - 16 * Math.cos(a + 0.5), y - 16 * Math.sin(a + 0.5)); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}
function packet(x, y, color = C.accent, r = 9, label) {
  glow(x, y, r * 4, color.replace(")", ",0.45)").replace("rgb", "rgba"));
  ctx.save(); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  if (label) text(label, x, y - 26, { size: 20, weight: 600, color: C.soft, align: "center", mono: true });
}
function check(x, y, r, p, color = C.green) {
  if (p <= 0) return;
  ctx.save();
  ctx.fillStyle = color; ctx.globalAlpha = clamp(p * 2);
  ctx.beginPath(); ctx.arc(x, y, r * pop(p), 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#0a0d1f"; ctx.lineWidth = r * 0.22; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const q = seg(p, 0.35, 1);
  ctx.beginPath(); ctx.moveTo(x - r * 0.42, y + r * 0.02);
  ctx.lineTo(x - r * 0.42 + r * 0.3 * clamp(q * 2), y + r * 0.02 + r * 0.3 * clamp(q * 2));
  if (q > 0.5) ctx.lineTo(x - r * 0.12 + r * 0.56 * seg(q, 0.5, 1), y + r * 0.32 - r * 0.62 * seg(q, 0.5, 1));
  ctx.stroke(); ctx.restore();
}
function cross(x, y, r, p) {
  if (p <= 0) return;
  ctx.save();
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.arc(x, y, r * pop(p), 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#0a0d1f"; ctx.lineWidth = r * 0.22; ctx.lineCap = "round";
  const d = r * 0.36 * clamp(p * 1.5);
  ctx.beginPath(); ctx.moveTo(x - d, y - d); ctx.lineTo(x + d, y + d); ctx.moveTo(x + d, y - d); ctx.lineTo(x - d, y + d); ctx.stroke();
  ctx.restore();
}
/** A phone outline whose screen `draw(x, y, w, h)` fills. */
function phone(x, y, w, h, draw, o = {}) {
  ctx.save();
  ctx.globalAlpha *= o.alpha ?? 1;
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 20;
  rr(x, y, w, h, w * 0.14); ctx.fillStyle = "#14141c"; ctx.fill(); ctx.shadowColor = "transparent";
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 2; ctx.stroke();
  const m = w * 0.04;
  ctx.save(); rr(x + m, y + m, w - 2 * m, h - 2 * m, w * 0.11); ctx.clip();
  ctx.fillStyle = o.screen ?? "#f5f6fa"; ctx.fillRect(x + m, y + m, w - 2 * m, h - 2 * m);
  draw(x + m, y + m, w - 2 * m, h - 2 * m);
  ctx.restore(); ctx.restore();
}
/** A small app UI inside a screen rect: a title and a few rows. */
function miniApp(x, y, w, h, o = {}) {
  const s = w / 300;
  text(o.title ?? "My Plants", x + 18 * s, y + 46 * s, { size: 24 * s, weight: 700, color: "#111" });
  const rows = o.rows ?? ["Boston fern", "Monstera", "Basil"];
  rows.forEach((r, i) => {
    const ry = y + (78 + i * 52) * s;
    rr(x + 14 * s, ry, w - 28 * s, 42 * s, 10 * s); ctx.fillStyle = "#ebedf3"; ctx.fill();
    text(r, x + 26 * s, ry + 21 * s, { size: 15 * s, weight: 600, color: "#222" });
    const accent = o.accent ?? "#2e7d32";
    rr(x + w - 84 * s, ry + 9 * s, 56 * s, 24 * s, 12 * s);
    if (o.filled?.(i)) { ctx.fillStyle = accent; ctx.fill(); text("Water", x + w - 56 * s, ry + 21 * s, { size: 12 * s, color: "#fff", align: "center" }); }
    else text("Water", x + w - 56 * s, ry + 21 * s, { size: 12 * s, color: accent, align: "center" });
  });
}
function typed(s, p) { return s.slice(0, Math.round(s.length * clamp(p))); }

// ---------- The left column, shared by every scene ----------
function column(section, t) {
  const a = (k) => easeOut(seg(t, 0.15 + k * 0.35, 0.75 + k * 0.35));
  const rise = (k) => (1 - a(k)) * 24;
  badge(120, 150 + rise(0), 84, section.icon, a(0));
  text(section.kicker.toUpperCase(), 120, 290 + rise(1), { size: 26, weight: 700, color: C.accent, spacing: 3, alpha: a(1) });
  const lines = wrap(section.title, 700, `700 66px ${FONT}`);
  lines.forEach((l, i) => text(l, 120, 366 + i * 76 + rise(2), { size: 66, weight: 700, alpha: a(2) }));
  let y = 366 + lines.length * 76 + 40;
  section.points.forEach((pt, i) => {
    const al = a(3 + i * 0.8);
    ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = C.accent; ctx.beginPath(); ctx.arc(128, y + rise(3 + i * 0.8), 6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    wrap(pt, 640, `400 32px ${FONT}`).forEach((l, j) => text(l, 152, y + j * 42 + rise(3 + i * 0.8), { size: 32, weight: 400, color: C.soft, alpha: al }));
    y += wrap(pt, 640, `400 32px ${FONT}`).length * 42 + 22;
  });
}
function wrap(s, width, font) {
  ctx.save(); ctx.font = font;
  const words = s.split(" "); const out = []; let line = "";
  for (const w of words) { const next = line ? `${line} ${w}` : w; if (ctx.measureText(next).width > width && line) { out.push(line); line = w; } else line = next; }
  if (line) out.push(line); ctx.restore(); return out;
}
const ICONS = {
  // Simple glyphs for the badge, drawn with paths (no icon font in headless Chromium).
  doc: (x, y, s) => { rr(x - s * 0.3, y - s * 0.4, s * 0.6, s * 0.8, s * 0.08); ctx.stroke(); for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(x - s * 0.16, y - s * 0.16 + i * s * 0.16); ctx.lineTo(x + s * 0.16, y - s * 0.16 + i * s * 0.16); ctx.stroke(); } },
  seal: (x, y, s) => { ctx.beginPath(); ctx.arc(x, y, s * 0.36, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - s * 0.15, y); ctx.lineTo(x - s * 0.03, y + s * 0.12); ctx.lineTo(x + s * 0.17, y - s * 0.12); ctx.stroke(); },
  cpu: (x, y, s) => { rr(x - s * 0.26, y - s * 0.26, s * 0.52, s * 0.52, s * 0.06); ctx.stroke(); for (const d of [-0.12, 0.12]) for (const side of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x + d * s, y + side * s * 0.26); ctx.lineTo(x + d * s, y + side * s * 0.4); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x + side * s * 0.26, y + d * s); ctx.lineTo(x + side * s * 0.4, y + d * s); ctx.stroke(); } },
  hand: (x, y, s) => { ctx.beginPath(); ctx.arc(x, y + s * 0.12, s * 0.2, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y - s * 0.08); ctx.lineTo(x, y - s * 0.4); ctx.stroke(); },
  bell: (x, y, s) => { ctx.beginPath(); ctx.moveTo(x - s * 0.28, y + s * 0.18); ctx.quadraticCurveTo(x - s * 0.22, y - s * 0.36, x, y - s * 0.36); ctx.quadraticCurveTo(x + s * 0.22, y - s * 0.36, x + s * 0.28, y + s * 0.18); ctx.closePath(); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y + s * 0.28, s * 0.07, 0, Math.PI * 2); ctx.stroke(); },
  share: (x, y, s) => { ctx.beginPath(); ctx.arc(x, y, s * 0.3, -0.3, Math.PI - 0.3); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, s * 0.3, Math.PI - 0.3 + 0.6, 2 * Math.PI - 0.3 - 0.6 + 0.6); ctx.stroke(); },
  spark: (x, y, s) => { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = (i * Math.PI) / 4; const r = i % 2 ? s * 0.12 : s * 0.38; ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)); } ctx.closePath(); ctx.fill(); },
  code: (x, y, s) => { ctx.beginPath(); ctx.moveTo(x - s * 0.12, y - s * 0.24); ctx.lineTo(x - s * 0.34, y); ctx.lineTo(x - s * 0.12, y + s * 0.24); ctx.moveTo(x + s * 0.12, y - s * 0.24); ctx.lineTo(x + s * 0.34, y); ctx.lineTo(x + s * 0.12, y + s * 0.24); ctx.stroke(); },
};
function badge(x, y, s, icon, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  const g = ctx.createLinearGradient(x, y, x + s, y + s); g.addColorStop(0, C.accent); g.addColorStop(1, C.violet);
  rr(x, y, s, s, s * 0.28); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.fillStyle = "#fff"; ctx.lineWidth = s * 0.06; ctx.lineCap = "round"; ctx.lineJoin = "round";
  (ICONS[icon] ?? ICONS.doc)(x + s / 2, y + s / 2, s);
  ctx.restore();
}

// ---------- Scenes: each draws the right half (x 900…1820) ----------
const SCENES = {};

// 1. A sentence becomes a spec, and the spec runs on three platforms.
SCENES.spec = (t) => {
  const sentence = "“Track my houseplants and remind me at 9 am”";
  const p1 = seg(t, 0.4, 2.6);
  card(960, 150, 820, 92, { alpha: easeOut(seg(t, 0.2, 0.6)) });
  text(typed(sentence, p1), 990, 196, { size: 30, weight: 500 });
  ctx.fillStyle = C.ink;
  if (p1 > 0 && p1 < 1 && Math.floor(t * 3) % 2 === 0) ctx.fillRect(990 + text(typed(sentence, p1), -9999, -9999, { size: 30, weight: 500 }) + 4, 178, 3, 36);
  arrow(1370, 252, 1370, 300, easeOut(seg(t, 2.6, 3.0)));
  // The model, pulsing while it writes.
  const mp = easeOut(seg(t, 2.8, 3.3));
  const pulse = 1 + 0.06 * Math.sin(t * 6) * seg(t, 3.0, 3.4) * (1 - seg(t, 6.4, 6.8));
  ctx.save(); ctx.globalAlpha = mp;
  glow(1370, 350, 180 * pulse, "rgba(184,97,255,0.35)");
  const g = ctx.createLinearGradient(1250, 310, 1490, 390); g.addColorStop(0, C.accent); g.addColorStop(1, C.violet);
  rr(1250, 312, 240, 76, 38); ctx.fillStyle = g; ctx.fill();
  text("Muse Spark", 1370, 350, { size: 30, weight: 700, align: "center" });
  ctx.restore();
  arrow(1370, 398, 1370, 440, easeOut(seg(t, 3.3, 3.6)));
  // The spec, typed with syntax colors.
  const specLines = [
    ["{", C.soft], ['  "screens": { "main": … },', C.ink], ['  "data": { "plants": "list" },', C.ink],
    ['  "actions": { "water": … },', C.ink], ['  "schedule": { "at": "09:00" }', C.amber], ["}", C.soft],
  ];
  const sp = seg(t, 3.5, 6.2);
  card(1080, 448, 580, 250, { alpha: easeOut(seg(t, 3.4, 3.7)), fill: C.code });
  specLines.forEach(([l, col], i) => {
    const lp = clamp(sp * specLines.length - i);
    text(typed(l, lp), 1110, 486 + i * 36, { size: 24, weight: 500, mono: true, color: col });
  });
  // Three platforms render it.
  const outs = [["iPhone", 1000], ["Android", 1290], ["Web", 1580]];
  outs.forEach(([name, x], i) => {
    const op = easeOut(seg(t, 6.4 + i * 0.25, 7.2 + i * 0.25));
    if (op <= 0) return;
    arrow(1370, 708, x + 100, 760, op, { alpha: op, lw: 3 });
    const yy = 770 + (1 - op) * 40;
    if (name === "Web") {
      card(x, yy, 210, 210, { alpha: op, fill: "#f5f6fa", r: 14 });
      ctx.save(); ctx.globalAlpha = op; ctx.fillStyle = "#d9dce6"; rr(x, yy, 210, 26, 14); ctx.fill();
      ["#ff6b6b", "#ffc857", "#38d39f"].forEach((c, k) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x + 18 + k * 16, yy + 13, 5, 0, 7); ctx.fill(); });
      ctx.save(); ctx.beginPath(); ctx.rect(x, yy + 26, 210, 184); ctx.clip(); miniApp(x, yy + 10, 210, 200); ctx.restore(); ctx.restore();
    } else phone(x + 40, yy, 120, 230, (sx, sy, sw, sh) => miniApp(sx, sy, sw, sh), { alpha: op });
    text(name, x + 100, yy + 252, { size: 22, color: C.soft, align: "center", alpha: op });
  });
};

// 2. A change passes the schema and a headless render, or goes back for repair.
SCENES.validate = (t, D) => {
  const gates = [["JSON Schema", 1180], ["Headless render", 1420], ["Live", 1660]];
  gates.forEach(([name, x], i) => {
    const a = easeOut(seg(t, 0.3 + i * 0.2, 0.8 + i * 0.2));
    card(x - 90, 300, 180, 300, { alpha: a, r: 26 });
    text(name, x, 640, { size: 24, color: C.soft, align: "center", alpha: a });
  });
  card(860 + 60, 380, 150, 140, { alpha: easeOut(seg(t, 0.2, 0.6)), fill: "rgba(107,122,255,0.25)", stroke: C.accent });
  text("Muse Spark", 995, 450, { size: 24, weight: 700, align: "center", alpha: easeOut(seg(t, 0.2, 0.6)) });
  // First pass: the schema catches a typo.
  const pass1 = easeInOut(seg(t, 1.2, 2.6));
  const px1 = lerp(1080, 1180, pass1);
  if (t < 4.6) specChip(px1, 450, t < 2.6 ? "change" : "change", C.accent);
  cross(1180, 340, 26, seg(t, 2.6, 3.0));
  if (t > 2.8 && t < 5.2) {
    card(1030, 690, 420, 70, { alpha: easeOut(seg(t, 2.8, 3.1)) * (1 - seg(t, 4.9, 5.2)), stroke: C.red });
    text("unknown style key 'colour'", 1240, 725, { size: 24, mono: true, color: C.red, align: "center", alpha: easeOut(seg(t, 2.8, 3.1)) * (1 - seg(t, 4.9, 5.2)) });
  }
  // Errors go back; the model repairs.
  const back = easeInOut(seg(t, 3.4, 4.6));
  if (back > 0 && back < 1) {
    ctx.save(); ctx.strokeStyle = C.red; ctx.lineWidth = 4; ctx.setLineDash([10, 10]); ctx.lineDashOffset = -t * 60;
    ctx.beginPath(); ctx.moveTo(1180, 600); ctx.quadraticCurveTo(1080, 720, 995, 525); ctx.stroke(); ctx.restore();
    packet(lerp(1180, 995, back), lerp(600, 525, back) + Math.sin(back * Math.PI) * 120, "rgb(255,107,107)", 9);
  }
  text("repair", 1075, 790, { size: 24, color: C.red, align: "center", alpha: seg(t, 3.4, 3.8) * (1 - seg(t, 5.2, 5.6)) });
  // Second pass: all green.
  const pass2 = easeInOut(seg(t, 5.0, 8.0));
  if (t >= 4.6 && t < 8.0) {
    const x = pass2 < 0.33 ? lerp(1080, 1180, pass2 / 0.33) : pass2 < 0.66 ? lerp(1180, 1420, (pass2 - 0.33) / 0.33) : lerp(1420, 1660, (pass2 - 0.66) / 0.34);
    specChip(x, 450, "repaired", C.green);
  }
  check(1180, 340, 26, seg(t, 5.9, 6.3));
  // The headless render: little screens flip through.
  const rp = seg(t, 6.2, 7.2);
  for (let k = 0; k < 3; k++) {
    const shown = rp * 3 > k;
    if (shown) phone(1395 - k * 6, 400 - k * 6, 60, 110, (sx, sy, sw, sh) => miniApp(sx, sy, sw, sh), { alpha: 0.5 + 0.5 * (k === Math.min(2, Math.floor(rp * 3))) });
  }
  check(1420, 340, 26, seg(t, 7.2, 7.6));
  check(1660, 340, 26, seg(t, 8.0, 8.4));
  text("Applied", 1660, 450, { size: 32, weight: 700, color: C.green, align: "center", alpha: seg(t, 8.0, 8.4) });
};
function specChip(x, y, label, color) {
  rr(x - 66, y - 34, 132, 68, 18); ctx.fillStyle = C.code; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  text("{ … }", x, y - 8, { size: 22, mono: true, color, align: "center" });
  text(label, x, y + 18, { size: 16, color: C.soft, align: "center" });
}

// 3. One runtime sends batches of ops; three hosts draw them.
SCENES.runtime = (t) => {
  const a = easeOut(seg(t, 0.2, 0.7));
  card(1110, 160, 520, 250, { alpha: a, fill: "rgba(107,122,255,0.18)", stroke: C.accent });
  text("Jig runtime · TypeScript", 1370, 200, { size: 28, weight: 700, align: "center", alpha: a });
  ["state & signals", "bindings", "flexbox layout", "ops batch"].forEach((l, i) => {
    const ap = easeOut(seg(t, 0.6 + i * 0.3, 1.0 + i * 0.3));
    const active = Math.floor(t * 2.5) % 4 === i && t > 2;
    rr(1150, 236 + i * 40, 440, 32, 10); ctx.save(); ctx.globalAlpha = ap; ctx.fillStyle = active ? "rgba(107,122,255,0.55)" : C.dim; ctx.fill(); ctx.restore();
    text(l, 1170, 252 + i * 40, { size: 20, mono: true, color: active ? C.ink : C.soft, alpha: ap });
  });
  const hosts = [["JavaScriptCore", "UIKit", 1000], ["QuickJS", "Android Views", 1300], ["Browser", "DOM", 1600]];
  hosts.forEach(([eng, ui, x], i) => {
    const hp = easeOut(seg(t, 1.6 + i * 0.2, 2.1 + i * 0.2));
    card(x - 120, 560, 240, 90, { alpha: hp });
    text(eng, x, 592, { size: 24, weight: 700, align: "center", alpha: hp });
    text("→ " + ui, x, 624, { size: 20, color: C.soft, align: "center", alpha: hp });
    arrow(1370, 420, x, 550, hp, { alpha: 0.35, lw: 2 });
    phone(x - 55, 690, 110, 210, (sx, sy, sw, sh) => miniApp(sx, sy, sw, sh, { filled: (r) => r === Math.floor(t * 1.5) % 3 }), { alpha: hp });
  });
  // Packets: one batch per frame, to every host.
  if (t > 2.4) {
    for (let k = 0; k < 6; k++) {
      const q = ((t - 2.4) * 0.9 + k / 6) % 1;
      hosts.forEach(([, , x], i) => {
        const px = lerp(1370, x, easeInOut(q)), py = lerp(420, 550, easeInOut(q));
        packet(px, py, i === 1 ? "rgb(56,211,159)" : i === 2 ? "rgb(255,200,87)" : "rgb(107,122,255)", 7);
      });
    }
  }
  text("ops: create · update · insert · frame", 1370, 470, { size: 22, mono: true, color: C.amber, align: "center", alpha: seg(t, 2.6, 3.2) });
  text("one batch per frame · hosts only measure text and draw", 1370, 960, { size: 22, color: C.soft, align: "center", alpha: seg(t, 3.0, 3.6) });
};

// 4. Select an element, the model patches its path, then checks a screenshot.
SCENES.point = (t) => {
  const done = seg(t, 7.6, 8.0);
  phone(980, 190, 320, 640, (sx, sy, sw, sh) => miniApp(sx, sy, sw, sh, { filled: (r) => r === 0 && done > 0 }), { alpha: easeOut(seg(t, 0.2, 0.6)) });
  // The cursor moves in and taps the first Water button.
  const cx = lerp(1500, 1222, easeInOut(seg(t, 0.8, 2.0))), cy = lerp(880, 316, easeInOut(seg(t, 0.8, 2.0)));
  const tap = seg(t, 2.0, 2.4);
  if (t > 0.8 && t < 3.4) {
    if (tap > 0) { ctx.save(); ctx.globalAlpha = 1 - tap; ctx.strokeStyle = C.accent; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, 10 + tap * 40, 0, 7); ctx.stroke(); ctx.restore(); }
    ctx.save(); ctx.fillStyle = "#fff"; ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + 14, cy + 34); ctx.lineTo(cx + 20, cy + 22); ctx.lineTo(cx + 32, cy + 20); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  // The selection outline pulses.
  if (t > 2.2) {
    const pulse = 0.6 + 0.4 * Math.sin(t * 6);
    ctx.save(); ctx.strokeStyle = C.accent; ctx.lineWidth = 3 + pulse * 2; ctx.globalAlpha = 1 - done;
    rr(1193, 303, 84, 36, 10); ctx.stroke(); ctx.restore();
  }
  // The spec path, then the patch.
  const pp = seg(t, 2.6, 3.8);
  card(1360, 220, 440, 70, { alpha: easeOut(seg(t, 2.5, 2.8)), fill: C.code });
  text(typed("/screens/main/…/button", pp), 1385, 255, { size: 22, mono: true, color: C.amber });
  const dp = easeOut(seg(t, 3.9, 4.4));
  card(1360, 320, 440, 200, { alpha: dp, fill: C.code });
  [["- \"variant\": \"plain\"", C.red], ["+ \"variant\": \"{{due ? 'primary'", C.green], ["+    : 'plain'}}\"", C.green]].forEach(([l, col], i) => {
    text(typed(l, seg(t, 4.2 + i * 0.5, 4.7 + i * 0.5)), 1385, 366 + i * 44, { size: 21, mono: true, color: col });
  });
  text("apply_patch", 1580, 490, { size: 18, color: C.soft, align: "center", alpha: dp });
  // The screenshot check: a shutter flash and a tick.
  const flash = seg(t, 6.2, 6.6);
  if (flash > 0 && flash < 1) { ctx.save(); ctx.globalAlpha = 1 - flash; ctx.fillStyle = "#fff"; rr(993, 203, 294, 614, 40); ctx.fill(); ctx.restore(); }
  card(1360, 560, 440, 90, { alpha: easeOut(seg(t, 6.0, 6.4)) });
  text("screenshot · looks right", 1580, 605, { size: 24, align: "center", alpha: easeOut(seg(t, 6.0, 6.4)) });
  check(1740, 605, 22, seg(t, 6.8, 7.2));
};

// 5. A schedule in the spec becomes an OS notification at 9:00, app closed.
SCENES.services = (t) => {
  // Clock to 9:00.
  const cp = easeInOut(seg(t, 0.6, 3.0));
  const hours = lerp(6.5, 9, cp);
  const cx = 1080, cy = 330, r = 120;
  ctx.save(); ctx.globalAlpha = easeOut(seg(t, 0.2, 0.6));
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.fill(); ctx.strokeStyle = C.line; ctx.lineWidth = 3; ctx.stroke();
  for (let i = 0; i < 12; i++) { const a = (i / 12) * 2 * Math.PI; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * (r - 14), cy + Math.sin(a) * (r - 14)); ctx.lineTo(cx + Math.cos(a) * (r - 4), cy + Math.sin(a) * (r - 4)); ctx.stroke(); }
  const ha = ((hours % 12) / 12) * 2 * Math.PI - Math.PI / 2, ma = ((hours % 1) * 2 * Math.PI) - Math.PI / 2;
  ctx.strokeStyle = C.ink; ctx.lineCap = "round"; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ha) * 60, cy + Math.sin(ha) * 60); ctx.stroke();
  ctx.lineWidth = 5; ctx.strokeStyle = C.accent; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(ma) * 92, cy + Math.sin(ma) * 92); ctx.stroke();
  ctx.restore();
  text("\"schedule\": { \"at\": \"09:00\" }", cx, 500, { size: 22, mono: true, color: C.amber, align: "center", alpha: seg(t, 0.4, 0.8) });
  // The locked phone; the banner slides in at 9:00.
  phone(1380, 160, 320, 640, (sx, sy, sw, sh) => {
    const g = ctx.createLinearGradient(sx, sy, sx, sy + sh); g.addColorStop(0, "#1d2350"); g.addColorStop(1, "#3b1f63");
    ctx.fillStyle = g; ctx.fillRect(sx, sy, sw, sh);
    const hh = Math.floor(hours), mm = Math.floor((hours % 1) * 60);
    text(`${hh}:${String(mm).padStart(2, "0")}`, sx + sw / 2, sy + 130, { size: 72, weight: 300, align: "center" });
    text("App closed", sx + sw / 2, sy + 190, { size: 18, color: C.soft, align: "center" });
    const bp = pop(seg(t, 3.2, 3.8));
    if (bp > 0) {
      const by = lerp(sy - 120, sy + 240, bp);
      rr(sx + 14, by, sw - 28, 96, 20); ctx.fillStyle = "rgba(255,255,255,0.92)"; ctx.fill();
      rr(sx + 28, by + 22, 50, 50, 12); ctx.fillStyle = "#2e7d32"; ctx.fill();
      text("Plants need water", sx + 92, by + 36, { size: 19, weight: 700, color: "#111" });
      text("Boston fern is due today", sx + 92, by + 64, { size: 16, weight: 400, color: "#444" });
    }
  }, { alpha: easeOut(seg(t, 0.3, 0.8)), screen: "#1d2350" });
  // What every app gets, as chips.
  [["SQLite storage", C.accent], ["Keychain secrets", C.violet], ["Widgets", C.green], ["Files & camera", C.amber]].forEach(([l, col], i) => {
    const a = pop(seg(t, 4.4 + i * 0.35, 4.9 + i * 0.35));
    if (a <= 0) return;
    const x = 960 + (i % 2) * 230, y = 600 + Math.floor(i / 2) * 90;
    ctx.save(); ctx.globalAlpha = clamp(a); ctx.translate(x + 105, y + 32); ctx.scale(a, a);
    rr(-105, -32, 210, 64, 32); ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.stroke();
    text(l, 0, 0, { size: 21, align: "center" }); ctx.restore();
  });
};

// 6. Pantry publishes, the store holds, the shopping list reads after one Allow.
SCENES.share = (t) => {
  const appCard = (x, title, rows, a, highlight) => {
    card(x, 230, 300, 380, { alpha: a });
    text(title, x + 24, 280, { size: 28, weight: 700, alpha: a });
    rows.forEach((r, i) => {
      const ra = a * (r.alpha ?? 1);
      rr(x + 20, 320 + i * 64, 260, 50, 12); ctx.save(); ctx.globalAlpha = ra; ctx.fillStyle = highlight === i ? "rgba(56,211,159,0.3)" : C.dim; ctx.fill(); ctx.restore();
      text(r.name, x + 40, 345 + i * 64, { size: 22, alpha: ra });
      if (r.count != null) text(String(r.count), x + 260, 345 + i * 64, { size: 22, color: r.count < 2 ? C.amber : C.soft, align: "right", alpha: ra });
    });
  };
  const low = t > 4.2;
  appCard(940, "Pantry", [{ name: "Tomatoes", count: 3 }, { name: "Jars", count: low ? 1 : 4 }, { name: "Spaghetti", count: 1 }], easeOut(seg(t, 0.2, 0.6)));
  // The store.
  const sa = easeOut(seg(t, 0.6, 1.0));
  ctx.save(); ctx.globalAlpha = sa;
  const sx = 1370, sy = 330;
  glow(sx, sy + 60, 160, "rgba(107,122,255,0.3)");
  ctx.fillStyle = "rgba(107,122,255,0.35)"; ctx.strokeStyle = C.accent; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(sx, sy, 90, 28, 0, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillRect(sx - 90, sy, 180, 130); ctx.beginPath(); ctx.moveTo(sx - 90, sy); ctx.lineTo(sx - 90, sy + 130); ctx.moveTo(sx + 90, sy); ctx.lineTo(sx + 90, sy + 130); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(sx, sy + 130, 90, 28, 0, 0, Math.PI); ctx.stroke();
  ctx.restore();
  text("personal data store", sx, 530, { size: 22, color: C.soft, align: "center", alpha: sa });
  // The shopping list asks once.
  const shopRows = [{ name: "Spaghetti" }, { name: "Oat milk" }, ...(t > 6.4 ? [{ name: "Jars", alpha: easeOut(seg(t, 6.4, 6.9)) }] : [])];
  appCard(1500, "Shopping", shopRows, easeOut(seg(t, 1.0, 1.4)), t > 6.4 && t < 8 ? 2 : -1);
  const dp = pop(seg(t, 1.6, 2.0)) * (1 - seg(t, 3.2, 3.5));
  if (dp > 0) {
    ctx.save(); ctx.globalAlpha = clamp(dp); ctx.translate(1650, 700); ctx.scale(dp, dp);
    rr(-210, -70, 420, 140, 22); ctx.fillStyle = "rgba(255,255,255,0.95)"; ctx.fill();
    text("Shopping wants to read", 0, -32, { size: 20, weight: 700, color: "#111", align: "center" });
    text("your pantry from Pantry", 0, -6, { size: 20, weight: 700, color: "#111", align: "center" });
    const pressed = t > 2.8;
    rr(40, 18, 140, 40, 20); ctx.fillStyle = pressed ? "#4053e0" : C.accent; ctx.fill();
    text("Allow", 110, 38, { size: 19, color: "#fff", align: "center" });
    rr(-180, 18, 160, 40, 20); ctx.fillStyle = "#e6e8f0"; ctx.fill();
    text("Don't allow", -100, 38, { size: 19, color: "#333", align: "center" });
    ctx.restore();
  }
  // Data flows: publish, then read.
  if (t > 3.4) {
    for (let k = 0; k < 3; k++) {
      const q = ((t - 3.4) * 0.7 + k / 3) % 1;
      packet(lerp(1240, 1280, q), 400, "rgb(107,122,255)", 7);
      packet(lerp(1460, 1500, q), 400, "rgb(56,211,159)", 7);
    }
    arrow(1240, 400, 1280, 400, 1, { lw: 3 });
    arrow(1460, 400, 1500, 400, 1, { lw: 3, color: C.green });
  }
  if (t > 4.2 && t < 6.4) {
    const q = easeInOut(seg(t, 4.6, 6.4));
    const x = q < 0.5 ? lerp(1240, 1370, q * 2) : lerp(1370, 1500, (q - 0.5) * 2);
    packet(x, 400 - Math.sin(q * Math.PI) * 80, "rgb(255,200,87)", 12, "Jars · 1");
  }
};

// 7. Apps call Meta's models through the shell, which holds the key.
SCENES.ai = (t) => {
  const a = (s) => easeOut(seg(t, s, s + 0.4));
  card(960, 180, 240, 100, { alpha: a(0.2) });
  text("App", 1080, 215, { size: 28, weight: 700, align: "center", alpha: a(0.2) });
  text("ask · findObjects", 1080, 250, { size: 18, mono: true, color: C.soft, align: "center", alpha: a(0.2) });
  card(1250, 180, 240, 100, { alpha: a(0.5), fill: "rgba(107,122,255,0.25)", stroke: C.accent });
  text("Shell", 1370, 215, { size: 28, weight: 700, align: "center", alpha: a(0.5) });
  // The key stays in the shell.
  ctx.save(); ctx.globalAlpha = a(0.7); ctx.strokeStyle = C.amber; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(1340, 250, 10, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.moveTo(1350, 250); ctx.lineTo(1385, 250); ctx.moveTo(1376, 250); ctx.lineTo(1376, 260); ctx.stroke(); ctx.restore();
  text("your key", 1415, 250, { size: 17, color: C.amber, alpha: a(0.7) });
  arrow(1200, 230, 1246, 230, a(0.6), { lw: 3 });
  const models = [["Muse Spark", 1000], ["SAM 3.1", 1370], ["Muse Image", 1700]];
  models.forEach(([m, x], i) => {
    card(x - 120, 360, 240, 80, { alpha: a(0.9 + i * 0.2), fill: "rgba(184,97,255,0.2)", stroke: C.violet });
    text(m, x, 400, { size: 26, weight: 700, align: "center", alpha: a(0.9 + i * 0.2) });
    arrow(1370, 290, x, 352, a(1.0 + i * 0.2), { lw: 2, alpha: 0.5 });
  });
  // A request travels and an answer streams back.
  const rq = easeInOut(seg(t, 1.8, 2.6));
  if (rq > 0 && rq < 1) packet(lerp(1080, 1000, rq), lerp(280, 360, rq), "rgb(107,122,255)", 9, "ask");
  card(940, 480, 330, 220, { alpha: a(2.6), fill: C.code });
  ["Chicken fried rice", "Pea & egg bowl", "Soy stir-fry"].forEach((l, i) => text(typed(`${i + 1}. ${l}`, seg(t, 2.8 + i * 0.6, 3.4 + i * 0.6)), 962, 525 + i * 50, { size: 20, mono: true, color: C.green }));
  // SAM draws boxes around jars on a shelf.
  const sx = 1290, sy = 480, sw = 380, sh = 260;
  card(sx, sy, sw, sh, { alpha: a(3.6), fill: "#3a2a1f", r: 16 });
  ctx.save(); ctx.globalAlpha = a(3.6);
  ctx.fillStyle = "#6b4a33"; ctx.fillRect(sx + 10, sy + sh - 60, sw - 20, 14);
  for (let k = 0; k < 4; k++) {
    const jx = sx + 40 + k * 82, jy = sy + 80;
    rr(jx, jy, 56, 120, 12); ctx.fillStyle = "rgba(200,220,255,0.55)"; ctx.fill();
    rr(jx + 6, jy - 14, 44, 20, 6); ctx.fillStyle = "#c9a227"; ctx.fill();
    const bp = seg(t, 4.4 + k * 0.35, 4.8 + k * 0.35);
    if (bp > 0) {
      ctx.save(); ctx.strokeStyle = C.green; ctx.lineWidth = 3; ctx.setLineDash([12, 6]);
      const m = 8 * (1 - easeOut(bp)); ctx.globalAlpha = clamp(bp * 2);
      rr(jx - 8 - m, jy - 22 - m, 72 + 2 * m, 150 + 2 * m, 8); ctx.stroke(); ctx.restore();
    }
  }
  ctx.restore();
  const count = Math.min(4, Math.floor(seg(t, 4.4, 5.8) * 4.01));
  if (count > 0) { rr(sx + sw - 150, sy + 16, 134, 44, 22); ctx.fillStyle = C.green; ctx.fill(); text(`jar × ${count}`, sx + sw - 83, sy + 38, { size: 22, weight: 700, color: "#0a0d1f", align: "center" }); }
  text("SAM 3.1 · findObjects", sx + sw / 2, sy + sh + 34, { size: 20, color: C.soft, align: "center", alpha: a(3.6) });
};

// 8. A sandboxed script computes a value; the UI is still a native view tree.
SCENES.code = (t) => {
  const a = (s) => easeOut(seg(t, s, s + 0.4));
  ctx.save(); ctx.globalAlpha = a(0.2); ctx.strokeStyle = C.accent; ctx.lineWidth = 3; ctx.setLineDash([14, 10]); ctx.lineDashOffset = -t * 30;
  rr(950, 170, 520, 380, 26); ctx.stroke(); ctx.restore();
  text("sandbox", 980, 205, { size: 22, weight: 700, color: C.accent, alpha: a(0.2) });
  const code = ["exports.convert = ({ text }) =>", "  yaml.dump(parseCsv(text));", "", "// libraries: js-yaml@4.1.0", "// sha256 9f2c…e41a"];
  code.forEach((l, i) => text(typed(l, seg(t, 0.6 + i * 0.5, 1.1 + i * 0.5)), 980, 260 + i * 40, { size: 22, mono: true, color: l.startsWith("//") ? C.soft : C.ink }));
  // The 5 s limit ring.
  const rp = seg(t, 1.5, 5.0);
  ctx.save(); ctx.globalAlpha = a(1.2); ctx.lineWidth = 8; ctx.strokeStyle = C.dim; ctx.beginPath(); ctx.arc(1390, 480, 40, 0, 7); ctx.stroke();
  ctx.strokeStyle = C.amber; ctx.beginPath(); ctx.arc(1390, 480, 40, -Math.PI / 2, -Math.PI / 2 + rp * 2 * Math.PI * 0.32); ctx.stroke(); ctx.restore();
  text("≤ 5 s", 1390, 480, { size: 18, weight: 700, align: "center", alpha: a(1.2) });
  // The lock: pinned by hash.
  ctx.save(); ctx.globalAlpha = a(2.4); ctx.strokeStyle = C.green; ctx.lineWidth = 4;
  rr(1280, 470, 44, 34, 6); ctx.stroke(); ctx.beginPath(); ctx.arc(1302, 470, 13, Math.PI, 0); ctx.stroke(); ctx.restore();
  // Outputs: a value and a native view tree.
  arrow(1210, 560, 1080, 640, a(3.4), { lw: 3 });
  arrow(1210, 560, 1520, 640, a(3.6), { lw: 3 });
  card(960, 650, 240, 80, { alpha: a(3.6), fill: C.code });
  text("value: \"key: …\"", 1080, 690, { size: 20, mono: true, color: C.green, align: "center", alpha: a(3.6) });
  // The tree.
  const nodes = [[1560, 670, "column"], [1460, 780, "text"], [1560, 780, "row"], [1660, 780, "button"], [1520, 880, "text"], [1600, 880, "toggle"]];
  const edges = [[0, 1], [0, 2], [0, 3], [2, 4], [2, 5]];
  edges.forEach(([i, j], k) => {
    const p = easeOut(seg(t, 4.0 + k * 0.2, 4.4 + k * 0.2));
    ctx.save(); ctx.globalAlpha = p; ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(nodes[i][0], nodes[i][1] + 20); ctx.lineTo(lerp(nodes[i][0], nodes[j][0], p), lerp(nodes[i][1] + 20, nodes[j][1] - 20, p)); ctx.stroke(); ctx.restore();
  });
  nodes.forEach(([x, y, l], k) => {
    const p = pop(seg(t, 3.9 + k * 0.2, 4.4 + k * 0.2));
    if (p <= 0) return;
    ctx.save(); ctx.globalAlpha = clamp(p); ctx.translate(x, y); ctx.scale(p, p);
    rr(-48, -20, 96, 40, 12); ctx.fillStyle = k === 0 ? "rgba(107,122,255,0.35)" : C.dim; ctx.fill(); ctx.strokeStyle = C.line; ctx.stroke();
    text(l, 0, 0, { size: 17, mono: true, align: "center" }); ctx.restore();
  });
  text("native view tree", 1560, 950, { size: 20, color: C.soft, align: "center", alpha: a(4.8) });
};

window.renderFrame = (id, t, duration, section) => {
  background();
  if (section) column(section, t);
  (SCENES[id] ?? (() => {}))(t, duration);
};
window.scenes = Object.keys(SCENES);
</script>
